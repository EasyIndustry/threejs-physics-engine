name: Error
description: El módulo no hace lo que promete (la API, la documentación o help()).
labels: [triage, error]
body:
  - type: markdown
    attributes:
      value: |
        Si "no anda" quiere decir "no hace lo que mi app necesita", es un **Pedido**, no un error.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Lo mínimo que lo muestra. Las definiciones de los cuerpos (en JSON, `fisica.toJSON()`), la secuencia de pasos y, si es de lo que se dibuja, sobre examples/index.html.
    validations:
      required: true
  - type: textarea
    id: versiones
    attributes:
      label: Versiones
      description: Del motor, de Rapier (@dimforge/rapier3d-compat), de three y el navegador (y de threejs-render-engine o threejs-game-engine si se usan con él).
    validations:
      required: true
  - type: textarea
    id: consola
    attributes:
      label: Errores en la consola
      render: text
