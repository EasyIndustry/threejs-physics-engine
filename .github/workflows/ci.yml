name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de desarrollo (three, Rapier y typescript; las pruebas simulan de verdad)
        run: npm install --no-audit --no-fund
      - name: Pruebas (Node, con Rapier y three reales, sin navegador)
        run: node --test
      - name: Tipos (tsc estricto, sin build)
        run: npx tsc -p .
